spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.188.128:3306/data_source_test?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 951753
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 8
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: DatebookHikariCP
      max-lifetime: 60000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  freemarker:
    cache: true
    check-template-location: true
    charset: utf-8
    suffix: .ftl
    template-loader-path: classpath:templates/freeMarker
  redis:
    host: 192.168.188.128
    port: 6379
    database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  type-enums-package: com.example.worktest.constant
  mapper-locations: classpath:/mappers/*Mapper.xml
  type-aliases-package: com.example.worktest.entity.*
  global-config:
    db-config: #实体类字段上加上@TableLogic注解
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)

message:
  broker:
#    type: redis
#    config:
#      host: 192.168.43.161
#      port: 6379
#      maxTotal: 20
#      maxIdle: 10
#      minIdle: 5

    type: local
    config:
      threadPoolSize: 10
      poolNamePrefix: websocket-exec-

flink:
  rest:
    address: ${FLINK_REST_HOST:192.168.188.128}
    port: ${FLINK_REST_PORT:8081}
    cluster-id: ${FLINK_CLUSTER_ID:standalone}
  storage:
    job-id-dir: ${JOB_ID_DIR:/var/data/flink/job-id-latest/}
    savepoint-dir: ${SAVEPOINT_DIR:/var/data/flink/savepoint-latest/}
  job:
    default-parallelism: ${FLINK_PARALLELISM:1}
    allow-non-restored-state: true
    max-restore-attempts: 3
  client:
    connection-timeout: 30000
    request-timeout: 60000
    retry-count: 3
    retry-delay: 1000